name: Build OnePlus-Sm8150-Kernel-OOS11
on:
  workflow_dispatch:
  schedule:
      - cron: '0 21 * * *'
  push:
    branches:
      - oneplus/OOS_SM8150_11.0
  pull_request:
      branches:
      - oneplus/OOS_SM8150_11.0

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: "blu_spark_defconfig"
      KERNEL_CMDLINE: "ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-androidkernel- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 O=out"
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 1
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      
    - name: Remove unnecessary files
      run: |
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
    - name: Install dependencies
      run: |
        sudo apt-get update -y 
        sudo apt install gcc-aarch64-linux-gnu -y
        sudo apt install gcc-arm-linux-gnueabi -y
        sudo apt install clang-14 -y
        sudo apt install binutils make python3 libssl-dev build-essential bc bison flex unzip libssl-dev ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs zip -y
        git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 aarch64 --depth=1
        git clone https://github.com/snowwolf725/AnyKernel3 -b oneplus7 --depth=1
        rm -rf AnyKernel3/.git

    - name: Integrate NoMount, Re-Kernel Natively & Configure Kernel
      run: |
        # 1. 原生集成 NoMount 源码
        curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh | bash

        # 2. 原生集成 Sakion-Team/Re-Kernel
        git clone https://github.com/Sakion-Team/Re-Kernel.git rekernel_tmp --depth=1
        
        # 复制 Re-Kernel 驱动源码到 drivers/rekernel
        if [ -d "rekernel_tmp/Integrate/drivers/rekernel" ]; then
          cp -rf rekernel_tmp/Integrate/drivers/rekernel drivers/
        elif [ -d "rekernel_tmp/Integrate/rekernel" ]; then
          cp -rf rekernel_tmp/Integrate/rekernel drivers/
        fi

        # 运行 Re-Kernel 官方 Modifier 脚本自动打补丁
        if [ -f "rekernel_tmp/Integrate/patch.py" ]; then
          python3 rekernel_tmp/Integrate/patch.py .
        elif [ -f "rekernel_tmp/Integrate/main.py" ]; then
          python3 rekernel_tmp/Integrate/main.py .
        fi
        
        rm -rf rekernel_tmp

        # 3. 写入内核配置开关
        CONFIG_FILE="arch/arm64/configs/$KERNEL_DEFCONFIG"
        if [ -f "$CONFIG_FILE" ]; then
          echo "CONFIG_KALLSYMS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KALLSYMS_ALL=y" >> "$CONFIG_FILE"
          echo "CONFIG_ZRAM_WRITEBACK=y" >> "$CONFIG_FILE"
          echo "CONFIG_NOMOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_OVERLAY_FS=y" >> "$CONFIG_FILE"
          echo "CONFIG_OVERLAY_FS_REDIRECT_DIR=y" >> "$CONFIG_FILE"
          echo "CONFIG_OVERLAY_FS_METACOPY=y" >> "$CONFIG_FILE"
          echo "CONFIG_NAMESPACES=y" >> "$CONFIG_FILE"
          echo "CONFIG_UTS_NS=y" >> "$CONFIG_FILE"
          echo "CONFIG_IPC_NS=y" >> "$CONFIG_FILE"
          echo "CONFIG_USER_NS=y" >> "$CONFIG_FILE"
          echo "CONFIG_PID_NS=y" >> "$CONFIG_FILE"
          echo "CONFIG_NET_NS=y" >> "$CONFIG_FILE"
          echo "CONFIG_REKERNEL=y" >> "$CONFIG_FILE"
        fi
        
        # 4. 改写 AnyKernel3 设备白名单
        if [ -f "AnyKernel3/anykernel.sh" ]; then
          sed -i '/device\.name/d' AnyKernel3/anykernel.sh
          echo "device.name1=OnePlus7" >> AnyKernel3/anykernel.sh
          echo "device.name2=OnePlus7Pro" >> AnyKernel3/anykernel.sh
          echo "device.name3=OnePlus7T" >> AnyKernel3/anykernel.sh
          echo "device.name4=OnePlus7TPro" >> AnyKernel3/anykernel.sh
          echo "device.name5=hotdogb" >> AnyKernel3/anykernel.sh
          echo "device.name6=hotdog" >> AnyKernel3/anykernel.sh
          echo "device.name7=guacamole" >> AnyKernel3/anykernel.sh
          echo "device.name8=guacamoleb" >> AnyKernel3/anykernel.sh
        fi

    - name: Build Kernel & Package Zip
      run: |
        export PATH=$(pwd)/clang/bin/:$(pwd)/aarch64/bin/:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export LD=ld.lld
        export BRAND_SHOW_FLAG=oneplus
        export TARGET_PRODUCT=msmnile
        make $KERNEL_CMDLINE $KERNEL_DEFCONFIG CC="ccache clang-14"
        make $KERNEL_CMDLINE CC="ccache clang-14" -j$(nproc --all)
        
        cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r9 "../OP7-OOS11-kernel-APatchReady.zip" * -x README.md
        cd ..

    - name: Upload Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: OP7-OOS11-kernel-APatchReady
        path: "*.zip"
