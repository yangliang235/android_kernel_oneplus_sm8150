name: Build OnePlus-Sm8150-Kernel-OOS11
on:
  workflow_dispatch:
  schedule:
      # Run once a week on Sunday at midnight. See http://crontab.guru
      - cron: '0 21 * * *'
  push:
    branches:
      - oneplus/OOS_SM8150_11.0
  pull_request:
      branches:
      - oneplus/OOS_SM8150_11.0

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: "blu_spark_defconfig"
      KERNEL_CMDLINE: "ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-androidkernel- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 O=out"
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 1
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      
    - name: Remove unnecessary files
      run: |
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
    - name: Install dependencies
      run: |
        sudo apt-get update -y 
        sudo apt install gcc-aarch64-linux-gnu -y
        sudo apt install gcc-arm-linux-gnueabi -y
        sudo apt install clang-14 -y
        sudo apt install binutils make python3 libssl-dev build-essential bc  bison flex unzip libssl-dev ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs -y
        git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 aarch64 --depth=1
        git clone https://github.com/snowwolf725/AnyKernel3 -b oneplus7 --depth=1
        rm -rf AnyKernel3/.git
    - name: Remove unnecessary files
      run: |
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
    - name: Setup APatch & Get Version
      id: get_version
      run: |
        git clone https://github.com/APatch-Root/APatch -b main --depth=1 APatch
        cd APatch
        echo "VERSION=$(expr $(git rev-list --count HEAD) + 10000)" >> $GITHUB_OUTPUT
        cd ..
        # 如果 APatch 带有自动化集成脚本，可在此处执行
        if [ -f "APatch/setup.sh" ]; then
          bash APatch/setup.sh .
        fi
    - name: Configure ZRAM Writeback and NoMount
      run: |
        CONFIG_FILE="arch/arm64/configs/$KERNEL_DEFCONFIG"
        if [ -f "$CONFIG_FILE" ]; then
          # 开启 ZRAM 回写支持
          echo "CONFIG_ZRAM_WRITEBACK=y" >> "$CONFIG_FILE"
          # 开启 NoMount / OverlayFS 及相关 Namespace 依赖支持
          echo "CONFIG_OVERLAY_FS=y" >> "$CONFIG_FILE"
          echo "CONFIG_NAMESPACES=y" >> "$CONFIG_FILE"
          echo "CONFIG_UTS_NS=y" >> "$CONFIG_FILE"
          echo "CONFIG_IPC_NS=y" >> "$CONFIG_FILE"
          echo "CONFIG_USER_NS=y" >> "$CONFIG_FILE"
          echo "CONFIG_PID_NS=y" >> "$CONFIG_FILE"
          echo "CONFIG_NET_NS=y" >> "$CONFIG_FILE"
        fi
    - name: Build Kernel
      run: |
        export PATH=$(pwd)/clang/bin/:$(pwd)/aarch64/bin/:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export LD=ld.lld
        export BRAND_SHOW_FLAG=oneplus
        export TARGET_PRODUCT=msmnile
        make $KERNEL_CMDLINE $KERNEL_DEFCONFIG CC="ccache clang-14"
        make $KERNEL_CMDLINE CC="ccache clang-14" -j$(nproc --all)
        cp out/arch/arm64/boot/Image AnyKernel3
    - name: Upload APatch Kernel
      uses: actions/upload-artifact@v4
      with:
        name: OP7-OOS11-kernel-APatch-${{ steps.get_version.outputs.VERSION }}
        path: "AnyKernel3/*"
